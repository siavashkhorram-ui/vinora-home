<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>VINORA HOME | ارتباط با ما</title>
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #302a24;
      --muted: #74695e;
      --line: #d9cdbd;
      --button: #fffdf9;
      --accent: #9a7958;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .wordmark {
      direction: ltr;
      font-family: Arial, sans-serif;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 600;
      letter-spacing: 4px;
      margin: 0 0 10px;
    }
    .subtitle {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .2px;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    a {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--button);
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      transition: border-color .15s ease, transform .15s ease;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a:hover { border-color: var(--accent); transform: translateY(-1px); }
    .label { font-weight: 600; }
    .detail { color: var(--muted); direction: ltr; font-size: 13px; }
    footer {
      margin-top: 34px;
      color: #9a8d7e;
      font-size: 11px;
      letter-spacing: 1.5px;
      direction: ltr;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">VINORA HOME</h1>
    <p class="subtitle">پخش و توزیع محصولات آشپزخانه</p>

    <nav class="links" aria-label="راه‌های ارتباطی">

        <span class="label">واتساپ</span>
      </a>
      <a href="https://t.me/Siavash_Khorram" target="_blank" rel="noopener noreferrer">
        <span class="label">تلگرام</span>
      </a>
      <a href="tel:+982182806072">
        <span class="label">تماس با دفتر</span>
        <span class="detail">02182806072</span>
      </a>
      <a href="tel:+989103207008">
        <span class="label">تماس با موبایل</span>
        <span class="detail">09103207008</span>
      </a>
    </nav>

    <footer>VINORA HOME</footer>
  </main>
</body>
</html>
